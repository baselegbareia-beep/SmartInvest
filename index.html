<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartInvest - Financial Charts</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(135deg, #161b22, #1a2332);
            padding: 16px 20px;
            border-bottom: 1px solid #30363d;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(90deg, #58a6ff, #3fb950, #d2a8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 12px;
            color: #8b949e;
            margin-top: 4px;
        }

        .legend-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 10px 16px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 16px;
            background: #161b22;
            border: 1px solid #30363d;
            transition: opacity 0.2s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .legend-item.disabled { opacity: 0.35; }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .chart-container {
            position: relative;
            width: 100%;
            padding: 8px 4px;
            height: calc(100vh - 210px);
            min-height: 320px;
        }

        .info-bar {
            display: flex;
            justify-content: space-around;
            padding: 12px 16px;
            background: #161b22;
            border-top: 1px solid #30363d;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
        }

        .info-item { text-align: center; }
        .info-item .label {
            font-size: 10px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-item .value {
            font-size: 15px;
            font-weight: 700;
            margin-top: 2px;
        }
        .info-item .value.vix { color: #f85149; }
        .info-item .value.sp500 { color: #58a6ff; }
        .info-item .value.gold { color: #d29922; }

        .note {
            text-align: center;
            font-size: 11px;
            color: #484f58;
            padding: 2px 16px 6px;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100vh - 100px);
            gap: 16px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text { font-size: 14px; color: #8b949e; }

        .error {
            text-align: center;
            padding: 40px 20px;
        }
        .error h2 { color: #f85149; font-size: 18px; margin-bottom: 8px; }
        .error p { font-size: 13px; color: #8b949e; }
    </style>
</head>
<body>
    <div class="header">
        <h1>SmartInvest</h1>
        <p>VIX &middot; S&amp;P 500 &middot; Gold &mdash; Monthly since Jan 1995</p>
    </div>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        <div class="loading-text">Loading chart data...</div>
    </div>

    <div id="app" style="display:none;">
        <div class="legend-bar" id="legend"></div>
        <div class="chart-container">
            <canvas id="chart"></canvas>
        </div>
        <div class="note" id="note"></div>
    </div>

    <div class="info-bar" id="infobar" style="display:none;">
        <div class="info-item">
            <div class="label">VIX</div>
            <div class="value vix" id="val-vix">--</div>
        </div>
        <div class="info-item">
            <div class="label">S&amp;P 500</div>
            <div class="value sp500" id="val-sp500">--</div>
        </div>
        <div class="info-item">
            <div class="label">Gold</div>
            <div class="value gold" id="val-gold">--</div>
        </div>
    </div>

    <div id="error" class="error" style="display:none;">
        <h2>Failed to load data</h2>
        <p>Could not load chart_data.json</p>
    </div>

    <script>
    const COLORS = { vix: '#f85149', sp500: '#58a6ff', gold: '#d29922' };

    let myChart = null;

    async function init() {
        let data;
        try {
            const resp = await fetch('data/chart_data.json');
            if (!resp.ok) throw new Error(resp.status);
            data = await resp.json();
            if (!data.labels || !data.labels.length) throw new Error('empty');
        } catch (e) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            return;
        }

        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('infobar').style.display = 'flex';
        document.getElementById('note').textContent =
            `${data.labels.length} months \u00b7 ${data.labels[0]} to ${data.labels[data.labels.length-1]} \u00b7 Day = 3rd highest VIX after month\u2019s peak`;

        renderChart(data);
        updateInfoBar(data);
    }

    function renderChart(data) {
        const ctx = document.getElementById('chart').getContext('2d');

        const mkDataset = (label, values, color, yAxisID) => ({
            label,
            data: values,
            borderColor: color,
            backgroundColor: color + '15',
            yAxisID,
            borderWidth: 1.5,
            pointRadius: 0,
            pointHitRadius: 10,
            tension: 0.3,
            fill: false,
            spanGaps: true
        });

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.labels,
                datasets: [
                    mkDataset('VIX', data.vix, COLORS.vix, 'yVix'),
                    mkDataset('S&P 500', data.sp500, COLORS.sp500, 'ySP'),
                    mkDataset('Gold', data.gold, COLORS.gold, 'yGold')
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#1c2128',
                        borderColor: '#30363d',
                        borderWidth: 1,
                        titleColor: '#e6edf3',
                        bodyColor: '#e6edf3',
                        titleFont: { size: 13 },
                        bodyFont: { size: 12 },
                        padding: 10,
                        displayColors: true,
                        callbacks: {
                            title(items) {
                                if (!items.length) return '';
                                return new Date(items[0].label).toLocaleDateString('en-US', {
                                    year: 'numeric', month: 'short', day: 'numeric'
                                });
                            },
                            label(ctx) {
                                const v = ctx.parsed.y;
                                if (v == null) return null;
                                const n = ctx.dataset.label;
                                if (n === 'VIX') return ` VIX: ${v.toFixed(2)}`;
                                if (n === 'S&P 500') return ` S&P 500: ${v.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
                                return ` Gold: $${v.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        type: 'time',
                        time: { unit: 'year', displayFormats: { year: 'yyyy' } },
                        grid: { color: 'rgba(48,54,61,0.4)' },
                        ticks: { color: '#8b949e', font: { size: 10 }, maxTicksLimit: 8 }
                    },
                    yVix: {
                        type: 'linear',
                        position: 'right',
                        title: { display: true, text: 'VIX', color: COLORS.vix, font: { size: 10 } },
                        grid: { display: false },
                        ticks: { color: COLORS.vix, font: { size: 9 } }
                    },
                    ySP: {
                        type: 'linear',
                        position: 'left',
                        title: { display: true, text: 'S&P 500', color: COLORS.sp500, font: { size: 10 } },
                        grid: { color: 'rgba(48,54,61,0.25)' },
                        ticks: { color: COLORS.sp500, font: { size: 9 } }
                    },
                    yGold: {
                        type: 'linear',
                        position: 'right',
                        title: { display: true, text: 'Gold ($)', color: COLORS.gold, font: { size: 10 } },
                        grid: { display: false },
                        ticks: { color: COLORS.gold, font: { size: 9 } }
                    }
                }
            }
        });

        buildLegend();
    }

    function buildLegend() {
        const bar = document.getElementById('legend');
        const series = [
            { idx: 0, label: 'VIX',     color: COLORS.vix,   axis: 'yVix' },
            { idx: 1, label: 'S&P 500',  color: COLORS.sp500, axis: 'ySP' },
            { idx: 2, label: 'Gold',     color: COLORS.gold,  axis: 'yGold' }
        ];

        series.forEach(s => {
            const el = document.createElement('div');
            el.className = 'legend-item';
            el.innerHTML = `<span class="legend-dot" style="background:${s.color}"></span>${s.label}`;
            el.addEventListener('click', () => {
                const meta = myChart.getDatasetMeta(s.idx);
                meta.hidden = !meta.hidden;
                el.classList.toggle('disabled', meta.hidden);
                myChart.options.scales[s.axis].display = !meta.hidden;
                myChart.update();
            });
            bar.appendChild(el);
        });
    }

    function updateInfoBar(data) {
        const i = data.labels.length - 1;
        const fmt = (v, prefix) => v != null
            ? prefix + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
            : '--';
        document.getElementById('val-vix').textContent = fmt(data.vix[i], '');
        document.getElementById('val-sp500').textContent = fmt(data.sp500[i], '');
        document.getElementById('val-gold').textContent = fmt(data.gold[i], '$');
    }

    init();
    </script>
</body>
</html>
